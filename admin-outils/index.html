<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Ajouter un outil | Albexia</title>
<style>
  :root { --bg:#0a0a0f; --bg2:#13131a; --border:#26262f; --text:#f0f0f5; --dim:#9a9aa5; --accent:#6c63ff; --pink:#ff6b9d; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .layout { display:flex; gap:24px; flex-wrap:wrap; }
  form { flex:1; min-width:300px; }
  .preview { flex:1; min-width:280px; position:sticky; top:24px; align-self:flex-start; }
  fieldset { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  legend { padding:0 8px; font-weight:600; font-size:13px; color:var(--pink); }
  label { display:block; font-size:12px; color:var(--dim); margin:10px 0 4px; }
  input, select, textarea {
    width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:14px; font-family:inherit;
  }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .accordion-toggle {
    background:var(--bg2); border:1px solid var(--border); border-radius:8px; color:var(--text);
    padding:10px 14px; cursor:pointer; font-size:13px; width:100%; text-align:left; margin-bottom:8px;
  }
  .accordion-body { display:none; }
  .accordion-body.open { display:block; }
  button[type=submit] {
    background:var(--accent); color:#fff; border:0; padding:14px; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; width:100%; margin-top:8px;
  }
  button[type=submit]:disabled { opacity:0.5; cursor:not-allowed; }
  .warn { background:rgba(255,107,157,0.1); border:1px solid rgba(255,107,157,0.3); color:var(--pink);
          padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
  .ok-msg { background:rgba(0,212,170,0.1); border:1px solid rgba(0,212,170,0.3); color:#00d4aa;
          padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
  /* Carte d'aperçu — calque le rendu réel des cartes outils */
  .preview-card {
    background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:16px;
  }
  .preview-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .preview-emoji { font-size:24px; }
  .preview-name { font-weight:700; font-size:15px; }
  .preview-cat { font-size:11px; color:var(--dim); }
  .preview-desc { font-size:13px; color:#c8c8d0; line-height:1.5; margin-bottom:10px; }
  .preview-tags { display:flex; flex-wrap:wrap; gap:6px; }
  .preview-tag { font-size:10px; background:rgba(108,99,255,0.15); color:#a8a3ff; padding:3px 8px; border-radius:6px; }
  #gate { text-align:center; padding-top:80px; }
  #app { display:none; }
</style>
</head>
<body>

  <!-- ─── PORTE D'ACCÈS ─── -->
  <div id="gate">
    <p>Vérification de l'accès…</p>
  </div>

  <!-- ─── FORMULAIRE (masqué tant que l'auth n'est pas confirmée) ─── -->
  <div id="app">
    <h1>Ajouter un outil</h1>
    <p class="sub">Connecté en tant qu'admin — les modifications sont publiques immédiatement.</p>

    <div class="warn" id="warn-box"></div>
    <div class="ok-msg" id="ok-box"></div>

    <div class="layout">
      <form id="tool-form">

        <fieldset>
          <legend>Champs communs</legend>

          <label>URL de l'outil *</label>
          <input type="url" id="f-url" placeholder="https://exemple.com" required>

          <div class="row">
            <div>
              <label>Catégorie *</label>
              <select id="f-category" required>
                <option value="">— Choisir —</option>
                <option>Texte</option>
                <option>Image</option>
                <option>Vidéo</option>
                <option>Musique</option>
                <option>Code</option>
                <option>Productivité</option>
              </select>
            </div>
            <div>
              <label>Emoji</label>
              <input type="text" id="f-emoji" placeholder="🤖" maxlength="4">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Prix</label>
              <select id="f-price">
                <option value="gratuit">Gratuit</option>
                <option value="freemium" selected>Freemium</option>
                <option value="payant">Payant</option>
              </select>
            </div>
            <div>
              <label>Plan</label>
              <select id="f-plan">
                <option value="">Standard</option>
                <option value="gratuit">Gratuit</option>
                <option value="starter">Starter</option>
                <option value="featured">Featured</option>
              </select>
            </div>
          </div>

          <label>Tags (séparés par des virgules)</label>
          <input type="text" id="f-tags" placeholder="rédaction, code, analyse">

          <div class="row">
            <div>
              <label>Essai gratuit</label>
              <select id="f-essai">
                <option value="true">Oui</option>
                <option value="false">Non</option>
              </select>
            </div>
            <div>
              <label>Durée essai</label>
              <input type="text" id="f-duree" placeholder="14 jours">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Contenu FR (obligatoire)</legend>
          <label>Nom de l'outil *</label>
          <input type="text" id="f-name-fr" required>
          <label>Description *</label>
          <textarea id="f-desc-fr" required placeholder="150-200 caractères recommandés"></textarea>
          <label>Idéal pour</label>
          <input type="text" id="f-ideal-fr" placeholder="Tous publics">
        </fieldset>

        <button type="button" class="accordion-toggle" data-target="acc-en">+ Ajouter EN (optionnel)</button>
        <div class="accordion-body" id="acc-en">
          <fieldset>
            <legend>Contenu EN</legend>
            <label>Nom</label>
            <input type="text" id="f-name-en">
            <label>Description</label>
            <textarea id="f-desc-en"></textarea>
            <label>Idéal pour</label>
            <input type="text" id="f-ideal-en">
          </fieldset>
        </div>

        <button type="button" class="accordion-toggle" data-target="acc-es">+ Ajouter ES (optionnel)</button>
        <div class="accordion-body" id="acc-es">
          <fieldset>
            <legend>Contenu ES</legend>
            <label>Nom</label>
            <input type="text" id="f-name-es">
            <label>Description</label>
            <textarea id="f-desc-es"></textarea>
            <label>Idéal pour</label>
            <input type="text" id="f-ideal-es">
          </fieldset>
        </div>

        <button type="submit" id="submit-btn">Créer l'outil</button>
      </form>

      <div class="preview">
        <p class="sub" style="margin-bottom:8px;">Aperçu (FR)</p>
        <div class="preview-card">
          <div class="preview-top">
            <span class="preview-emoji" id="p-emoji">🤖</span>
            <div>
              <div class="preview-name" id="p-name">Nom de l'outil</div>
              <div class="preview-cat" id="p-cat">Catégorie</div>
            </div>
          </div>
          <p class="preview-desc" id="p-desc">La description apparaîtra ici au fur et à mesure de la saisie.</p>
          <div class="preview-tags" id="p-tags"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db, onAuthStateChanged, collection, getDocs, doc, setDoc }
      from '../js/firebase-config.js';

    // ⚠️ Doit correspondre exactement à l'UID autorisé dans firestore.rules
    const ADMIN_UID = "e9Hvx3qHcIOlTPkTnqCWRAVnt042";

    const gate = document.getElementById('gate');
    const app  = document.getElementById('app');

    onAuthStateChanged(auth, (user) => {
      if (user && user.uid === ADMIN_UID) {
        gate.style.display = 'none';
        app.style.display   = 'block';
      } else {
        gate.innerHTML = '<p>Accès refusé. Connectez-vous avec le compte admin sur <a href="../profil.html" style="color:#ff6b9d">profil.html</a>.</p>';
      }
    });

    // ── Accordéons EN/ES ──
    document.querySelectorAll('.accordion-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const isOpen = target.classList.toggle('open');
        btn.textContent = (isOpen ? '− ' : '+ ') + btn.textContent.slice(2);
      });
    });

    // ── Aperçu live ──
    function updatePreview() {
      document.getElementById('p-emoji').textContent = document.getElementById('f-emoji').value || '🤖';
      document.getElementById('p-name').textContent   = document.getElementById('f-name-fr').value || 'Nom de l\'outil';
      document.getElementById('p-cat').textContent    = document.getElementById('f-category').value || 'Catégorie';
      document.getElementById('p-desc').textContent   = document.getElementById('f-desc-fr').value || 'La description apparaîtra ici au fur et à mesure de la saisie.';
      const tags = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      document.getElementById('p-tags').innerHTML = tags.map(t => `<span class="preview-tag">${t}</span>`).join('');
    }
    ['f-emoji','f-name-fr','f-category','f-desc-fr','f-tags'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    function slugify(str) {
      return str.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retire les accents
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
    }

    function showWarn(msg) {
      const box = document.getElementById('warn-box');
      box.textContent = msg;
      box.style.display = 'block';
      document.getElementById('ok-box').style.display = 'none';
    }
    function showOk(msg) {
      const box = document.getElementById('ok-box');
      box.textContent = msg;
      box.style.display = 'block';
      document.getElementById('warn-box').style.display = 'none';
    }

    document.getElementById('tool-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      document.getElementById('warn-box').style.display = 'none';
      document.getElementById('ok-box').style.display = 'none';

      try {
        const url = document.getElementById('f-url').value.trim();
        if (!url.startsWith('http')) { showWarn('L\'URL doit commencer par http(s)://'); submitBtn.disabled = false; return; }

        const nameFr = document.getElementById('f-name-fr').value.trim();
        const descFr = document.getElementById('f-desc-fr').value.trim();
        const category = document.getElementById('f-category').value;
        if (!nameFr || !descFr || !category) { showWarn('Nom, description et catégorie sont obligatoires.'); submitBtn.disabled = false; return; }

        // ── Vérification de doublon par URL ──
        const allDocs = await getDocs(collection(db, 'outils'));
        const existing = allDocs.docs.map(d => d.data());
        const dup = existing.find(t => (t.url || '').replace(/\/$/, '') === url.replace(/\/$/, ''));
        if (dup && !confirm(`Un outil avec cette URL existe déjà ("${dup.name}"). Continuer quand même ?`)) {
          submitBtn.disabled = false;
          return;
        }

        // ── Génération de l'ID séquentiel suivant ──
        const numericIds = existing
          .map(t => Number(t.id))
          .filter(n => Number.isInteger(n) && !isNaN(n));
        const nextId = numericIds.length ? Math.max(...numericIds) + 1 : 1;

        const emoji    = document.getElementById('f-emoji').value.trim() || '🤖';
        const favicon  = `https://www.google.com/s2/favicons?sz=64&domain=${new URL(url).hostname}`;
        const price    = document.getElementById('f-price').value;
        const plan     = document.getElementById('f-plan').value;
        const tags     = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
        const essai    = document.getElementById('f-essai').value === 'true';
        const duree    = document.getElementById('f-duree').value.trim();
        const idealFr  = document.getElementById('f-ideal-fr').value.trim();
        const slug     = slugify(nameFr);
        const planFolder = plan === 'featured' ? 'featured' : 'standard';

        const traductions = {};
        const docsToWrite = [];

        // ── Document FR (toujours créé) ──
        const baseDoc = {
          id: nextId, name: nameFr, category, emoji, favicon, description: descFr,
          price, rating: 0, url, tags, page: `tools/${planFolder}/${slug}.html`,
          plan, langue: 'fr', essai_gratuit: essai, duree_essai: duree,
          ideal_pour: idealFr, traductions: {},
        };

        const nameEn = document.getElementById('f-name-en').value.trim();
        const descEn = document.getElementById('f-desc-en').value.trim();
        if (nameEn && descEn) {
          traductions.en = `${nextId}-en`;
          docsToWrite.push({
            id: `${nextId}-en`, name: nameEn, category, emoji, favicon, description: descEn,
            price, rating: 0, url, tags, page: `tools/en/${slug}.html`,
            plan, langue: 'en', traductions: { fr: nextId },
            ideal_pour: document.getElementById('f-ideal-en').value.trim(),
          });
        }

        const nameEs = document.getElementById('f-name-es').value.trim();
        const descEs = document.getElementById('f-desc-es').value.trim();
        if (nameEs && descEs) {
          traductions.es = `${nextId}-es`;
          docsToWrite.push({
            id: `${nextId}-es`, name: nameEs, category, emoji, favicon, description: descEs,
            price, rating: 0, url, tags, page: `tools/es/${slug}.html`,
            plan, langue: 'es', traductions: { fr: nextId },
            ideal_pour: document.getElementById('f-ideal-es').value.trim(),
          });
        }

        baseDoc.traductions = traductions;
        docsToWrite.unshift(baseDoc);

        for (const d of docsToWrite) {
          await setDoc(doc(db, 'outils', String(d.id)), d);
        }

        showOk(`✓ Outil créé (ID ${nextId}). ${docsToWrite.length} document(s) écrit(s). Rappel : la fiche détaillée (tools/.../${slug}.html) n'est pas générée automatiquement — pensez à la créer via votre process habituel si nécessaire.`);
        document.getElementById('tool-form').reset();
        updatePreview();

      } catch (err) {
        showWarn(`Erreur : ${err.message}`);
      }
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
