name: Générer les fiches outils, articles et comparateur

on:
  workflow_dispatch:        # Bouton manuel dans GitHub Actions
  push:
    branches: [main]
    paths:
      - 'gen-fiches.js'    # Re-génère si le script change

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install firebase-admin

      - name: Générer les fiches HTML (outils + articles + comparateur)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node gen-fiches.js

      - name: Commit et push les fiches générées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/ articles/ comparateur/ .gen-state.json
          git diff --staged --quiet || git commit -m "🤖 Fiches outils, articles et comparateur générées automatiquement"
          git push
