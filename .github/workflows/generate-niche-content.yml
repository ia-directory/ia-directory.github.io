name: Générer le contenu IA des niches

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Traiter une seule niche par son slug (laisser vide pour tout traiter)'
        required: false
        default: ''
      force:
        description: 'Régénérer même les niches qui ont déjà un contenu'
        required: false
        type: boolean
        default: false

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install firebase-admin

      - name: Générer le contenu IA
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug=${{ github.event.inputs.slug }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node generate-niche-content.js $ARGS
